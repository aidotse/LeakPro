server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Model/dataset uploads exceed the 1m default
    client_max_body_size 2048m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WS to backend. Two blocks: nginx prefix matching is a
    # literal string match, so `^~ /jobs/` alone would NOT match the bare
    # `/jobs` that createJob/listJobs call — it would fall through to the SPA
    # and return HTML. The exact match catches the bare path; the prefix match
    # covers everything under it without also matching e.g. /jobsxyz.
    location = /jobs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location ^~ /jobs/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
