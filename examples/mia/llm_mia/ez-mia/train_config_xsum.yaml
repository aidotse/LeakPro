# Target preparation for the LLM MIA example (prepare_target.py). Reproduces the EZ-MIA paper's
# XSum / GPT-2 / full fine-tuning setting -- the exact row the paper's Table 2 (0.993 AUC, 82.6%
# TPR@1%FPR, 33.1% TPR@0.1%FPR) reports, distinct from train_config_ez-mia.yaml's WikiText row
# (arXiv:2601.12104, Table 1/6). Same train.* hyperparameters as WikiText: Table 5 uses one fixed
# recipe (epochs/LR/batch) across every dataset, only the data changes.
run:
  random_seed: 1337
  log_dir: ./target_xsum_{finetune_method}   # separate from target_{finetune_method} (WikiText) -- does not conflict

train:
  model_name: gpt2
  dtype: float32
  finetune_method: full       # full | lora   (override with --finetune-method)
  epochs: 3
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.0
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  load_best_checkpoint_at_end: true  # see train_config_ez-mia.yaml's comment for why (paper appendix A.2)
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [c_attn, c_proj, c_fc]

data:
  # EdinburghNLP/xsum: BBC news articles + one-sentence summaries. `document` is the article body --
  # the paper fine-tunes on article text, not the summary. Single default config, no hf_config needed.
  hf_dataset: EdinburghNLP/xsum
  split: train
  text_field: document
  chunking: prefix            # one chunk per document (first 128 tokens, rest discarded) -- matches the
                              # reference code's XSum/ag_news path, NOT its WikiText path (which concatenates
                              # and slices continuously instead -- see train_config_ez-mia.yaml/prepare_target.py's
                              # _tokenise docstring). Long documents (e.g. football live-text commentary) would
                              # otherwise be sliced into many chunks and disproportionately dominate fine-tuning.
  max_length: 128
  n_sequences: 20500          # population size; members + non-members + validation must fit inside it
  n_members: 10000
  n_nonmembers: 10000
  n_validation: 500           # disjoint from n_members/n_nonmembers -- used only for load_best_checkpoint_at_end's
                              # epoch selection, never scored. Matches the paper's own reference code (which draws
                              # a genuinely separate 500-sequence validation pool, not the audit non-members).
  data_path: ./data/xsum_gpt2_128.pkl   # separate from wikitext_gpt2_128.pkl -- does not conflict
