## DP-SGD privacy-utility optimization settings (schema: leakpro.schemas.PrivacyUtilityConfig).
## This configures the OUTER optimization loop; the per-trial audit.yaml files
## are generated by the run and are not meant to be edited.

n_trials: 40          # total configurations to evaluate (resume counts finished ones)
seed: 0               # sampler + splits + derived audit seeds
proxy_fpr: 0.01       # FPR the loop minimizes TPR at; one of 0.0001, 0.001, 0.01, 0.1,
                      # and n_test * proxy_fpr must allow >= ~10 false positives
delta: 1.0e-5         # DP delta for epsilon accounting; keep well below 1/n_target
epochs: 15            # fixed training epochs (add an 'epochs' knob below to search it)
output_dir: "leakpro_output/dpsgd_optimization"

# The searched DP-SGD knobs. Narrow bounds, or move a knob to `fixed`, to pin it.
knobs:
  - {name: noise_multiplier, low: 0.4,   high: 4.0, log_scale: true}
  - {name: max_grad_norm,    low: 0.1,   high: 10.0, log_scale: true}
  - {name: learning_rate,    low: 0.001, high: 0.5, log_scale: true}
  - {name: batch_size,       low: 64,    high: 512, log_scale: true, integer: true}
fixed: {}

# Utility metric on the held-out split, and the "did it learn" gate.
# metric: accuracy | balanced_accuracy | auc
#   - accuracy's chance level is only meaningful on class-BALANCED data (CIFAR-10 is);
#     for imbalanced data use balanced_accuracy or auc.
# gate: utility floor below which the attack is skipped and the config is pruned.
#   Omit (or null) to use the metric's chance level (auc: 0.5, others: 1/num_classes).
utility:
  metric: accuracy
  gate: null

# RMIA attack config, passed verbatim into every generated audit.yaml.
# Any AttackRMIA parameter can go here (gamma, offline_a, temperature, ...).
rmia:
  num_shadow_models: 4
  training_data_fraction: 0.5
  online: false

# Population and audit-split sizes (members = n_target, nonmembers = n_test).
# pop_size = 2 * n_target is DELIBERATE and enforced: RMIA's balanced shadow
# sampling trains every reference model on half the population, and only
# pop_size = 2 * n_target makes that equal the target's training-set size —
# otherwise the references run DP-SGD at a different sampling rate q = B/N and
# step count than the target they calibrate, and mimicry silently breaks.
splits:
  pop_size: 10000
  n_target: 5000
  n_test: 2000
