audit:
  random_seed: 2026
  attack_type: extraction
  data_modality: image
  output_dir: ./leakpro_output/demonstration
  hyper_param_search: false
  attack_list:
    - attack: carlini_diffusion
      random_seed: 2026
      authorized_audit: true
      overwrite_results: true
      mode: unconditional_reference_audit
      image_range: minus_one_one
      num_unconditional_generations: 4096
      generation_batch_size: 64
      reference_neighbors: 50
      reference_alpha: 0.5
      ratio_threshold: 1.0
      verification_l2_threshold: 0.15
      max_extractions: 32
      distance_block_size: 64
      distance_device: cpu

    - attack: side
      random_seed: 2026
      authorized_audit: true
      overwrite_results: true
      image_range: minus_one_one
      compute_device: auto
      distance_device: cpu
      synthetic_samples: 4096
      synthetic_batch_size: 64
      clusters: 32
      cohesion_threshold: 0.5
      min_cluster_size: 2
      kmeans_n_init: 5
      classifier_epochs: 10
      classifier_batch_size: 32
      classifier_learning_rate: 0.0001
      classifier_base_width: 64
      classifier_blocks: [3, 4, 6, 3]
      timestep_embedding_dim: 128
      guidance_scale: 10.0
      num_generations: 4096
      generation_batch_size: 16
      l2_bands:
        near_copy:
          lower: 0.0
          upper: 0.3

target:
  name: cifar10_unconditional_ddim
  fingerprint: set-by-notebook
